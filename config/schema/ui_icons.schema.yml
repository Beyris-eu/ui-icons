# Keyed by icon pack id. UiIconsHooks::configSchemaInfoAlter() adds a key per
# pack, typed ui_icons.icon_pack_options.PACK_ID when an extension declares
# that schema, else built from the pack settings.
ui_icons.icon_pack_settings:
  type: mapping
  label: 'Icon settings'
  mapping: {}

ui_icons.icon_value:
  type: mapping
  label: 'Icon value'
  mapping:
    target_id:
      type: string
      label: 'Icon full ID'
    settings:
      type: ui_icons.icon_pack_settings
